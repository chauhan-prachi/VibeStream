{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - VibeStream</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b1220;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.wrapper{
    width:100%;
    max-width:460px;
    padding:40px 20px;
}

.logo-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:24px;
}

.logo-icon{
    width:38px;
    height:38px;
    border-radius:12px;
    background:#e50914;
}

.logo-text{
    font-size:28px;
    font-weight:800;
    color:#fff;
    letter-spacing:.4px;
}

.card{
    background:#141922;
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:36px;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
}

.card h1{
    font-size:26px;
    margin-bottom:10px;
}

.subtitle{
    color:#b8c0cc;
    margin-bottom:22px;
    line-height:1.5;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:16px;
    border-radius:14px;
    border:1px solid #2b3442;
    background:#0b0f17;
    color:#fff;
    font-size:16px;
}

.form-group input:focus{
    outline:none;
    border-color:#e50914;
    box-shadow:0 0 0 3px rgba(229,9,20,.15);
}

.errorlist{
    list-style:none;
    color:#ff6b6b;
    font-size:14px;
    margin-bottom:8px;
}

.primary-btn{
    width:100%;
    padding:16px;
    border:none;
    border-radius:999px;
    background:#e50914;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.25s;
    margin-top:8px;
}

.primary-btn:hover{
    background:#ff1f2d;
}

.divider{
    display:flex;
    align-items:center;
    margin:28px 0;
    color:#8f98a3;
    font-size:13px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#2b3442;
}

.divider span{
    padding:0 14px;
}

.google-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:16px;
    border-radius:999px;
    background:#fff;
    color:#111;
    text-decoration:none;
    font-weight:600;
    transition:.25s;
    margin-bottom:6px;
}
.google-btn:hover{
    background:#f3f3f3;
}

.google-btn img{
    width:20px;
    height:20px;
}

.footer-link{
    margin-top:26px;
    text-align:center;
    color:#b8c0cc;
    font-size:14px;
}

.footer-link a{
    color:#fff;
    text-decoration:none;
    font-weight:600;
}

.footer-link a:hover{
    color:#ff4d5a;
}

.back-home{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#9aa4b2;
    text-decoration:none;
    font-size:14px;
}

.back-home:hover{
    color:#fff;
}
</style>
</head>

<body>

<div class="wrapper">

    <div class="logo-wrap">
        <div class="logo-icon"></div>
        <div class="logo-text">VibeStream</div>
    </div>

    <div class="card">

        <h1>Create account</h1>

        <p class="subtitle">
            
        </p>
    <form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label>Email</label>
         <input type="email" name="email" placeholder="Enter your email" required>
    </div>

    <div class="form-group">
        <label>Password</label>
        <input type="password" name="password1" placeholder="Password" required>
    </div>

    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" name="password2" placeholder="Confirm Password" required>
    </div>

    <button type="submit" class="primary-btn">
        Create VibeStream Account
    </button>
</form>
        <div class="divider">
            <span>OR</span>
        </div>

        <a href="{% url 'google_login' %}" class="google-btn">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google">
            Continue with Google
        </a>

    </div>

    <div class="footer-link">
        Already have an account?
       <a href="{% url 'login' %}">Sign in</a>
    </div>

    <a href="{% url 'home' %}" class="back-home">
        ← Back to VibeStream
    </a>

</div>

</body>
</html>
