<div id="authModal" class="auth-modal hidden">

    <div class="auth-backdrop" onclick="closeAuthModal()"></div>

    <div class="auth-card">

        <!-- Close Button -->
        <button class="close-btn" onclick="closeAuthModal()">×</button>

        <!-- Logo -->
        <div class="logo-wrap">
            <div class="logo-icon"></div>
            <div class="logo-text">VibeStream</div>
        </div>

        <!-- Heading -->
        <h2>Sign In</h2>
        <p class="subtitle">Sign in to continue watching</p>

        <!-- Login Form -->
        <form method="post" action="{% url 'login' %}">
    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Email or Username"
        autocomplete="username"
        required>

    <div class="password-field">
        <input
            type="password"
            id="loginPassword"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            required>

        <span onclick="togglePassword('loginPassword', this)">
            Show
        </span>
    </div>

    <div class="forgot-password">
    <a href="{% url 'password_reset' %}">Forgot password?</a>
</div>

    <button type="submit" class="primary-btn">
        Sign In
    </button>
</form>
        <!-- Divider -->
        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Google Login -->
        <a href="{% url 'google_login' %}" class="google-btn">
            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
                alt="Google"> 
            Continue with Google 
        </a> 
 
        <!-- Signup Link --> 
        <div class="signup-link"> 
            New to VibeStream? 
            <a href="{% url 'signup' %}">Create your VibeStream account</a> 
        </div> 
 
    </div> 
 
</div>
