<div class="movie-card">

    <a href="{% url 'movie_detail' movie.id %}">
        <img src="{{ movie.poster_url }}" alt="{{ movie.title }}">
    </a>
    {% if user.is_authenticated %}
<a href="{% url 'toggle_watchlist' movie.id %}"
   class="watchlist-heart"
   title="My List">

    {% if movie.id in watchlist_ids %}
        ❤️
    {% else %}
        🤍
    {% endif %}

</a>
{% endif %}
    <!-- Hover Overlay -->
    <div class="card-overlay">

        <div class="overlay-buttons">

    <!-- Play -->
    <a href="{% url 'watch_movie' movie.id %}" class="overlay-btn play-btn">
        ▶
    </a>

    <!-- Watch Later -->
    <a href="{% url 'add_to_watchlist' movie.id %}" class="overlay-btn">
        +
    </a>

    <!-- Details -->
    <a href="{% url 'movie_detail' movie.id %}" class="overlay-btn">
        ℹ
    </a>

</div>

        <div class="overlay-meta">
            <span class="overlay-rating">⭐ {{ movie.rating|floatformat:1 }}</span>
            <span class="overlay-year">{{ movie.release_year }}</span>
        </div>

        <div class="overlay-genre">
            {{ movie.genre }}
        </div>

    </div>

    <!-- Normal Movie Info -->
    <div class="movie-info">

        <h3>{{ movie.title }}</h3>

        <p>{{ movie.release_year }}</p>

        <p class="rating">
            ⭐ {{ movie.rating|floatformat:1 }}
        </p>

    </div>

</div>
