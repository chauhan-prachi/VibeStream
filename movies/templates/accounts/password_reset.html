<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - VibeStream</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050810;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.card{
    width:100%;
    max-width:480px;
    background:#141922;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:40px;
}

h1{
    margin-bottom:15px;
}

p{
    color:#b8c0cc;
    margin-bottom:22px;
    line-height:1.5;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0f141d;
    color:#fff;
    margin-bottom:20px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e50914;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff1f2d;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#b8c0cc;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

    <h1>Forgot Password?</h1>

    <p>
        Enter the email address associated with your VibeStream account and
        we’ll send you a password reset link.
    </p>

    <form method="post">
        {% csrf_token %}
        {{ form.email }}
        <button type="submit">Send Reset Link</button>
    </form>

    <a href="{% url 'home' %}" class="back">
        ← Back to Home
    </a>

</div>

</body>
</html>
