<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create New Password - VibeStream</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#050810;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.card{
    width:100%;
    max-width:500px;
    background:#141922;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:40px;
}

h1{
    margin-bottom:15px;
}

p{
    color:#b8c0cc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#0f141d;
    color:#fff;
    margin-bottom:18px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#e50914;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff1f2d;
}
</style>
</head>

<body>

<div class="card">

    <h1>Create New Password</h1>

    <p>Choose a new password for your VibeStream account.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update Password</button>
    </form>

</div>

</body>
</html>
