<!DOCTYPE html>
<html lang="en">
<head>

<title>Check Your Email - VibeStream</title>
<style>

    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    font-family:Arial,sans-serif;
}

.card{
    text-align:center;
    background:#141922;
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:40px;
    width:100%;
    max-width:480px;
}

a{
    display:inline-block;
    margin-top:20px;
    padding:14px 24px;
    border-radius:10px;
    background:#e50914;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
    <h1>Check Your Email</h1>
    <p>If an account exists with that email address, we’ve sent a password reset link.</p>
    <a href="{% url 'home' %}">Return to VibeStream</a>

</html>
